<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site Under Maintenance - FertilEus Network</title>
  <meta name="description" content="FertilEus Network is currently under maintenance. We'll be back soon.">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #f8f9f7 0%, #e8ebe7 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .maintenance-container {
      max-width: 600px;
      text-align: center;
      background: white;
      padding: 60px 40px;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
    }

    .maintenance-icon {
      font-size: 80px;
      color: #4a7c59;
      margin-bottom: 30px;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.1);
      }
    }

    .maintenance-title {
      font-size: 32px;
      color: #2c3e50;
      margin-bottom: 20px;
      font-weight: 700;
    }

    .maintenance-message {
      font-size: 18px;
      color: #5a6c7d;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .maintenance-details {
      background: #f8f9f7;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 30px;
    }

    .maintenance-details p {
      color: #5a6c7d;
      font-size: 16px;
      margin: 10px 0;
    }

    .maintenance-details i {
      color: #4a7c59;
      margin-right: 10px;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: #e8ebe7;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 30px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #4a7c59, #6b9b7a);
      border-radius: 4px;
      animation: progress 3s ease-in-out infinite;
    }

    @keyframes progress {
      0% {
        width: 0%;
      }
      50% {
        width: 70%;
      }
      100% {
        width: 100%;
      }
    }

    .contact-info {
      margin-top: 30px;
      padding-top: 30px;
      border-top: 1px solid #e8ebe7;
    }

    .contact-info p {
      color: #5a6c7d;
      font-size: 16px;
      margin: 10px 0;
    }

    .contact-info a {
      color: #4a7c59;
      text-decoration: none;
      font-weight: 600;
    }

    .contact-info a:hover {
      text-decoration: underline;
    }

    @media (max-width: 768px) {
      .maintenance-container {
        padding: 40px 20px;
      }

      .maintenance-icon {
        font-size: 60px;
      }

      .maintenance-title {
        font-size: 24px;
      }

      .maintenance-message {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="maintenance-container">
    <div class="maintenance-icon">
      <i class="fa-solid fa-gear"></i>
    </div>
    <h1 class="maintenance-title">Site Under Maintenance</h1>
    <p class="maintenance-message">
      We're currently performing scheduled maintenance to improve your experience. We'll be back shortly!
    </p>
    
    <div class="progress-bar">
      <div class="progress-fill"></div>
    </div>
    
    <div class="maintenance-details">
      <p><i class="fa-solid fa-clock"></i> Expected completion: Soon</p>
      <p><i class="fa-solid fa-tools"></i> We're working hard to serve you better</p>
      <p><i class="fa-solid fa-heart"></i> Thank you for your patience</p>
    </div>
    
    <div class="contact-info">
      <p>Need urgent assistance?</p>
      <p><a href="mailto:info@fertileus.com.ng">info@fertileus.com.ng</a></p>
    </div>
  </div>
</body>
</html>
