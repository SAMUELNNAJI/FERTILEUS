<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Something went wrong – FertileUs Network</title>
    <meta name="robots" content="noindex" />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f8f9f7;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        color: #2c3e50;
      }
      .container {
        max-width: 520px;
        text-align: center;
        background: #fff;
        padding: 56px 40px;
        border-radius: 20px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
      }
      .icon {
        font-size: 64px;
        margin-bottom: 24px;
      }
      h1 {
        font-size: 72px;
        font-weight: 700;
        color: #4a7c59;
        line-height: 1;
        margin-bottom: 8px;
      }
      h2 {
        font-size: 24px;
        font-weight: 600;
        margin-bottom: 16px;
      }
      p {
        color: #5a6c7d;
        line-height: 1.6;
        margin-bottom: 32px;
      }
      .actions {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }
      a {
        display: inline-block;
        padding: 12px 28px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
        font-size: 15px;
        transition: opacity 0.2s;
      }
      a:hover {
        opacity: 0.85;
      }
      .btn-primary {
        background: #4a7c59;
        color: #fff;
      }
      .btn-outline {
        border: 2px solid #4a7c59;
        color: #4a7c59;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon">🌿</div>
      <h1>500</h1>
      <h2>Something went wrong</h2>
      <p>
        We are experiencing a technical issue. Our team has been notified.
        Please try again in a few minutes.
      </p>
      <div class="actions">
        <a href="/" class="btn-primary">Go back home</a>
        <a href="/contact/" class="btn-outline">Contact us</a>
      </div>
    </div>
  </body>
</html>
