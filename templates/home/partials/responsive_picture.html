{% load image_tags %}
{# Responsive picture element with WebP and JPEG sources #}
{% if image_url %}
<picture>
  {# WebP format for modern browsers - smaller file size #}
  <source
    type="image/webp"
    srcset="
      {% imagekit_transform image_url width=400 format='webp' %} 400w,
      {% imagekit_transform image_url width=800 format='webp' %} 800w,
      {% imagekit_transform image_url width=1200 format='webp' %} 1200w,
      {% imagekit_transform image_url width=1600 format='webp' %} 1600w
    "
    sizes="{{ sizes }}"
  />
  
  {# JPEG fallback for older browsers #}
  <source
    type="image/jpeg"
    srcset="
      {% imagekit_transform image_url width=400 format='jpg' %} 400w,
      {% imagekit_transform image_url width=800 format='jpg' %} 800w,
      {% imagekit_transform image_url width=1200 format='jpg' %} 1200w,
      {% imagekit_transform image_url width=1600 format='jpg' %} 1600w
    "
    sizes="{{ sizes }}"
  />
  
  {# Default img tag - must be present #}
  <img
    src="{% imagekit_transform image_url width=800 %}"
    alt="{{ alt_text }}"
    {% if css_class %}class="{{ css_class }}"{% endif %}
    loading="lazy"
    decoding="async"
  />
</picture>
{% endif %}
