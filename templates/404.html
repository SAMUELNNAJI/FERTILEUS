<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found – FertileUs Network</title>
    <meta name="robots" content="noindex" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Inter", sans-serif;
        background: #e9f1ea;
        height: 100vh;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .card {
        max-width: 500px;
        width: 100%;
        text-align: center;
        padding: 0 40px;
      }

      /* Sprout */
      .sprout {
        display: inline-block;
        margin-bottom: 36px;
      }

      /* Big error number */
      .code {
        font-family: "Playfair Display", Georgia, serif;
        font-size: clamp(100px, 24vw, 136px);
        font-weight: 700;
        color: #1e4d2b;
        line-height: 1;
        margin-bottom: 8px;
        letter-spacing: -3px;
      }

      /* Subheading */
      h1 {
        font-family: "Playfair Display", Georgia, serif;
        font-size: clamp(22px, 5vw, 30px);
        font-weight: 700;
        color: #0f1a10;
        margin-bottom: 24px;
      }

      /* Body text */
      p {
        font-size: 17px;
        color: #4e6352;
        line-height: 1.7;
        max-width: 340px;
        margin: 0 auto 52px;
      }

      /* Buttons row */
      .actions {
        display: flex;
        gap: 16px;
        justify-content: center;
        flex-wrap: wrap;
      }

      a.btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 168px;
        padding: 19px 34px;
        border-radius: 50px;
        font-size: 16px;
        font-weight: 600;
        text-decoration: none;
        transition:
          transform 0.15s,
          opacity 0.15s,
          box-shadow 0.15s;
      }

      a.btn:hover {
        transform: translateY(-2px);
        opacity: 0.9;
      }

      a.btn-primary {
        background: #2d6a40;
        color: #fff;
        box-shadow: 0 8px 24px rgba(45, 106, 64, 0.38);
      }

      a.btn-outline {
        background: transparent;
        color: #1e4d2b;
        border: 2.5px solid #2d6a40;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <!-- Two-leaf sprout icon — matches the design exactly -->
      <div class="sprout" aria-hidden="true">
        <svg
          width="60"
          height="68"
          viewBox="0 0 60 68"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <!-- stem -->
          <path
            d="M30 68 C30 68 30 42 30 28"
            stroke="#2d6a40"
            stroke-width="3.5"
            stroke-linecap="round"
          />
          <!-- left leaf: curves up-left from stem -->
          <path
            d="M30 36 C26 30 14 26 10 14 C20 13 30 22 30 36Z"
            fill="#2d6a40"
          />
          <!-- right leaf: curves up-right from stem, slightly higher and lighter -->
          <path
            d="M30 26 C34 18 46 14 50 2 C40 3 30 14 30 26Z"
            fill="#3d7a50"
          />
        </svg>
      </div>

      <div class="code">404</div>
      <h1>Page not found</h1>
      <p>The page you are looking for does not exist or has been moved.</p>

      <div class="actions">
        <a href="/" class="btn btn-primary">Go back home</a>
        <a href="/contact/" class="btn btn-outline">Contact us</a>
      </div>
    </div>
  </body>
</html>
