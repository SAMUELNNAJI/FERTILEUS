services:
  - type: web
    name: fertileus
    runtime: python
    buildCommand: bash build.sh
    startCommand: gunicorn FertileUs.wsgi:application --workers 2 --threads 2 --timeout 120
    plan: free

    envVars:
      - key: SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: "False"

      - key: ALLOWED_HOSTS
        value: ".onrender.com"

      - key: PYTHON_VERSION
        value: "3.11.0"

      # ── Postgres — auto-linked from the database below ────────
      - key: DATABASE_URL
        fromDatabase:
          name: fertileus-db
          property: connectionString

      # ── ImageKit CDN ──────────────────────────────────────────
      - key: IMAGEKIT_PUBLIC_KEY
        sync: false

      - key: IMAGEKIT_PRIVATE_KEY
        sync: false

      - key: IMAGEKIT_URL_ENDPOINT
        sync: false

      # ── AI Provider ───────────────────────────────────────────
      - key: GROQ_API_KEY
        sync: false

      - key: GEMINI_API_KEY
        sync: false

      - key: OPENAI_API_KEY
        sync: false

databases:
  - name: fertileus-db
    plan: free
    databaseName: fertileus
    user: fertileus
